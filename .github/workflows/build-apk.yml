name: Build Pokemon Card Radar APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore original Android project
        run: |
          base64 -d source/project.zip.b64 > /tmp/project.zip
          echo "9db720b8585b730a9d957fe48d897c54c937e6d01a4c3710a4db34ce8d0cc3f2  /tmp/project.zip" | sha256sum --check
          unzip -oq /tmp/project.zip -d .
          python3 scripts/verify_project.py
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - name: Install SDK platform
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk pokemon-card-radar.apk
          sha256sum pokemon-card-radar.apk > pokemon-card-radar.apk.sha256
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PokemonCardRadar-APK
          path: |
            pokemon-card-radar.apk
            pokemon-card-radar.apk.sha256
          retention-days: 30
          if-no-files-found: error
